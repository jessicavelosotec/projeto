<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C. Humanas</title>
    <link rel="stylesheet" href="voltar.css">
    <link rel="stylesheet" href="natureza.css">
</head>
<body>

<section class="academico-container">

    <img src="img/image copy 4.png" class="flor flor1">
    <img src="img/image copy 4.png" class="flor flor2">
    <img src="img/image copy 4.png" class="flor flor3">
    <img src="img/image copy 4.png" class="flor flor4">

    <img src="img/image copy 2.png" class="laco laco1">
    <img src="img/image copy 2.png" class="laco laco2">

    <img src="img/image copy 5.png" class="estrela estrela1">
    <img src="img/image copy 5.png" class="estrela estrela2">

    <div class="titulo-area">
        <span class="linha"></span>
        <h1>Ciências Humanas</h1>
        <span class="linha"></span>
    </div>

    <div class="cards-area">
        <div class="card-academico">
            <a href="https://www.canva.com/design/DAHDxI1FmTA/GbnOHLaTaIcP3ENWLdc_ug/edit" target="_blank">
                <img src="img/h1.png" class="atividade-img">
            </a>
        </div>

        <div class="card-academico">
            <a href="https://www.canva.com/design/DAHDxG6dMig/PhcdLc7aRuNeAsV3aW9Dig/edit" target="_blank">
                <img src="img/h2.png" class="atividade-img">
            </a>
        </div>

        <div class="card-academico">
            <a href="https://www.canva.com/design/DAHDxEFGvkg/xKOdygacoqmmQHxoDGgMTQ/edit" target="_blank">
                <img src="img/h3.png" class="atividade-img">
            </a>
        </div>

        <div class="card-academico">
            <a href="https://www.canva.com/design/DAHDxG6i-m8/1aSGNSeA1kxSPWZHeSfv3g/edit" target="_blank">
                <img src="img/h4.png" class="atividade-img">
            </a>
        </div>
    </div>

    <div class="titulo-area escolhidas">
        <span class="linha"></span>
        <h1>Atividades Escolhidas</h1>
        <span class="linha"></span>
    </div>

    <div class="carrossel-wrapper">
        <div class="carrossel-container">
            <button class="seta-carrossel" onclick="mudarSlide(-1)">&#10094;</button>

            <div class="carrossel-slides">
                <!-- INDEX 0: EIXO 1 -->
                <div class="card-academico destaque slide-item ativo">
                    <img src="img/h.png" class="atividade-img" onclick="abrirZoom(this.src)">
                    <p class="legenda-eixo">Eixo 1</p>
                </div>

                <!-- INDEX 1: EIXO 2 -->
                <div class="card-academico destaque slide-item">
                    <img src="img/hh.png" class="atividade-img" onclick="abrirZoom(this.src)">
                    <p class="legenda-eixo">Eixo 2</p>
                </div>

                <!-- INDEX 2: EIXO 3 -->
                <div class="card-academico destaque slide-item">
                    <img src="img/hhh.png" class="atividade-img" onclick="abrirZoom(this.src)">
                    <p class="legenda-eixo">Eixo 3</p>
                </div>

                <!-- INDEX 3: EIXO 4 -->
                <div class="card-academico destaque slide-item">
                    <img src="img/hhhh.png" class="atividade-img" onclick="abrirZoom(this.src)">
                    <p class="legenda-eixo">Eixo 4</p>
                </div>
            </div>

            <button class="seta-carrossel" onclick="mudarSlide(1)">&#10095;</button>
        </div>

        <div class="indicadores-carrossel">
            <span class="ponto-index ativo" onclick="irParaSlide(0)"></span>
            <span class="ponto-index" onclick="irParaSlide(1)"></span>
            <span class="ponto-index" onclick="irParaSlide(2)"></span>
            <span class="ponto-index" onclick="irParaSlide(3)"></span>
        </div>
    </div>

    <!-- BOTÃO VOLTAR AO INÍCIO -->
    <div class="area-voltar">
        <a href="portfolio.html" class="btn-voltar-inicio">&#8592; Voltar ao Início</a>
    </div>

</section>

<div id="modalZoom" class="modal-zoom" onclick="fecharZoom()">
    <button class="fechar-zoom" onclick="fecharZoom()">&#10005;</button>
    <img id="imgZoom" class="img-ampliada" onclick="event.stopPropagation()">
</div>

<script src="carrossel.js"></script>
</body>
</html>
