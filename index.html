<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="index.css">
</head>

<body>

    <div class="card">

        <h2>Login</h2>

        <form id="loginForm">

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                name="email"
                required
                placeholder="seu@email.com"
            >

            <label for="senha">Senha</label>

            <input
                type="password"
                id="senha"
                name="senha"
                required
                placeholder="Digite sua senha"
            >

            <button type="submit">
                ENTRAR
            </button>

        </form>

    </div>

    <script src="index.js"></script>

</body>

</html>
