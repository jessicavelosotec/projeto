<!-- MODAL PARA ZOOM DAS IMAGENS -->
<div id="modalZoom" class="modal-zoom">
    <span class="fechar-modal" onclick="fecharZoom()">&times;</span>
    <img class="imagem-modal" id="imgExpandida">
    <div id="legendaModal" class="legenda-modal"></div>
</div>

<script>
    function abrirZoom(elementoImg) {
        var modal = document.getElementById("modalZoom");
        var imgModal = document.getElementById("imgExpandida");
        var legenda = document.getElementById("legendaModal");

        modal.style.display = "flex";
        imgModal.src = elementoImg.src;
        legenda.innerText = elementoImg.alt;
    }

    function fecharZoom() {
        document.getElementById("modalZoom").style.display = "none";
    }

    // Fechar ao clicar fora da imagem
    window.onclick = function(event) {
        var modal = document.getElementById("modalZoom");
        if (event.target == modal) {
            modal.style.display = "none";
        }
    }
</script>
